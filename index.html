<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>棒球壘審判決模擬器｜九局實戰視角版</title>
  <style>
    :root {
      --bg: #0b131e;
      --panel: #142131;
      --panel-light: #1c2e44;
      --border: #2b4462;
      --text: #eef4fb;
      --muted: #93abc7;
      --safe: #18b86b;
      --safe-dark: #0f874d;
      --out: #e64545;
      --out-dark: #b32828;
      --accent: #f5b942;
      --blue: #3b9cff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 12px;
      background: radial-gradient(circle at top, #17283d 0%, var(--bg) 75%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 記分板 */
    .scoreboard {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1.2fr;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      align-items: center;
    }

    .teams-score {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .team-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
    }

    .team-row.batting {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(245, 185, 66, 0.35);
    }

    .team-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.92rem;
    }

    .team-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .team-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .challenge-tag {
      font-size: 0.72rem;
      color: var(--muted);
      background: var(--panel-light);
      padding: 2px 6px;
      border-radius: 5px;
    }

    .team-runs {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--accent);
      min-width: 24px;
      text-align: right;
    }

    .game-state-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      height: 100%;
    }

    .inning-outs {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .inning-label {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
    }

    .outs-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .out-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #23344a;
      border: 1px solid #425e80;
    }

    .out-dot.on {
      background: var(--out);
      border-color: #ff8787;
      box-shadow: 0 0 6px rgba(230, 69, 69, 0.7);
    }

    /* 迷你壘包狀態圖 */
    .diamond-mini {
      position: relative;
      width: 56px;
      height: 46px;
    }

    .mini-base {
      position: absolute;
      width: 15px;
      height: 15px;
      background: #23344a;
      border: 1.5px solid #527399;
      transform: rotate(45deg);
      transition: background 0.2s ease;
    }

    .mini-base.on {
      background: var(--accent);
      border-color: #fff3c4;
      box-shadow: 0 0 8px rgba(245, 185, 66, 0.8);
    }

    .mini-base.b2 { top: 4px; left: 20px; }
    .mini-base.b3 { top: 20px; left: 4px; }
    .mini-base.b1 { top: 20px; left: 36px; }

    .ump-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .stat-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 6px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--muted);
    }

    .stat-value {
      font-size: 0.98rem;
      font-weight: 700;
      color: #7cc4ff;
      margin-top: 2px;
    }

    /* 工具列 */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
    }

    .base-selector {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .base-selector span {
      font-size: 0.84rem;
      color: var(--muted);
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 9px;
      font-weight: 600;
      transition: transform 0.08s ease, background 0.15s ease, opacity 0.15s ease;
    }

    button:active:not(:disabled) {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-tab {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 0.84rem;
    }

    .btn-tab.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .btn-ghost {
      background: var(--panel-light);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 11px;
      font-size: 0.82rem;
    }

    /* 畫布區 */
    .stage-wrap {
      position: relative;
      background: #0b121b;
      border: 2px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.48);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
    }

    .overlay-banner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(8, 13, 21, 0.82);
      backdrop-filter: blur(3px);
      text-align: center;
      padding: 20px;
      z-index: 10;
    }

    .overlay-banner.hidden {
      display: none;
    }

    .banner-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--out);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .banner-title {
      font-size: 1.55rem;
      font-weight: 800;
      margin: 0 0 8px;
    }

    .banner-desc {
      font-size: 0.94rem;
      color: #d6e4f5;
      max-width: 540px;
      line-height: 1.5;
      margin: 0 0 16px;
    }

    /* 控制面板 */
    .control-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .status-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.94rem;
    }

    .status-text {
      font-weight: 700;
      color: #fff;
    }

    .hint-text {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .action-row.single {
      grid-template-columns: 1fr;
    }

    .btn-primary {
      background: var(--blue);
      color: #fff;
      padding: 13px 16px;
      font-size: 1.02rem;
    }

    .btn-safe {
      background: var(--safe);
      color: #fff;
      padding: 15px;
      font-size: 1.12rem;
      box-shadow: 0 4px 0 var(--safe-dark);
    }

    .btn-out {
      background: var(--out);
      color: #fff;
      padding: 15px;
      font-size: 1.12rem;
      box-shadow: 0 4px 0 var(--out-dark);
    }

    .btn-accent {
      background: var(--accent);
      color: #161b22;
      padding: 13px 16px;
      font-size: 1rem;
    }

    .replay-box {
      background: #0f1a28;
      border: 1px solid #35567c;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .replay-box.hidden,
    .result-box.hidden {
      display: none;
    }

    .replay-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .replay-badge {
      background: #c92a2a;
      color: #fff;
      font-size: 0.76rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .replay-time {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.94rem;
      color: var(--accent);
      font-weight: 700;
    }

    .scrubber {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .replay-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .btn-sm {
      background: var(--panel-light);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    .btn-sm.active {
      background: var(--accent);
      color: #141921;
      border-color: var(--accent);
    }

    .result-box {
      background: #0f1b29;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .result-headline {
      font-size: 1.08rem;
      font-weight: 800;
    }

    .result-headline.good { color: #46e095; }
    .result-headline.bad { color: #ff6b6b; }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
    }

    .result-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 7px 10px;
    }

    .result-item .k {
      font-size: 0.74rem;
      color: var(--muted);
    }

    .result-item .v {
      font-size: 0.94rem;
      font-weight: 700;
      margin-top: 2px;
    }

    @media (max-width: 720px) {
      .scoreboard {
        grid-template-columns: 1fr;
      }
      .action-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 九局記分板 -->
    <div class="scoreboard">
      <div class="teams-score">
        <div class="team-row batting" id="rowAway">
          <div class="team-name">
            <span class="team-dot" style="background:#e64545;"></span>
            <span>客隊（紅鷹）</span>
          </div>
          <div class="team-meta">
            <span class="challenge-tag" id="chalAway">挑戰權：1</span>
            <span class="team-runs" id="scoreAway">0</span>
          </div>
        </div>
        <div class="team-row" id="rowHome">
          <div class="team-name">
            <span class="team-dot" style="background:#3b9cff;"></span>
            <span>主隊（藍鯨）</span>
          </div>
          <div class="team-meta">
            <span class="challenge-tag" id="chalHome">挑戰權：1</span>
            <span class="team-runs" id="scoreHome">0</span>
          </div>
        </div>
      </div>

      <div class="game-state-center">
        <div class="inning-outs">
          <div class="inning-label" id="inningDisplay">1局上</div>
          <div class="outs-row">
            <span>OUT</span>
            <span class="out-dot" id="outDot1"></span>
            <span class="out-dot" id="outDot2"></span>
            <span class="out-dot" id="outDot3"></span>
          </div>
        </div>
        <div class="diamond-mini" title="目前壘包狀況">
          <div class="mini-base b2" id="miniB2"></div>
          <div class="mini-base b3" id="miniB3"></div>
          <div class="mini-base b1" id="miniB1"></div>
        </div>
      </div>

      <div class="ump-stats">
        <div class="stat-box">
          <div class="stat-label">總判決</div>
          <div class="stat-value" id="statTotal">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">初判準率</div>
          <div class="stat-value" id="statInitial">--%</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">最終正確</div>
          <div class="stat-value" id="statFinal">--%</div>
        </div>
      </div>
    </div>

    <!-- 工具列 -->
    <div class="toolbar">
      <div class="base-selector">
        <span>執法壘審視角：</span>
        <button class="btn-tab active" data-base="1">一壘審</button>
        <button class="btn-tab" data-base="2">二壘審</button>
        <button class="btn-tab" data-base="3">三壘審</button>
        <button class="btn-tab" data-base="random">隨機切換</button>
      </div>
      <div class="btn-group">
        <button class="btn-ghost" id="btnSound">🔊 音效：開</button>
        <button class="btn-ghost" id="btnNewGame">重新開賽（九局）</button>
      </div>
    </div>

    <!-- 主畫布 -->
    <div class="stage-wrap">
      <canvas id="gameCanvas" width="960" height="540"></canvas>

      <!-- 教練挑戰彈窗 -->
      <div class="overlay-banner hidden" id="challengeBanner">
        <div class="banner-tag">COACH CHALLENGE</div>
        <h2 class="banner-title" id="challengeTitle">總教練提出重播挑戰！</h2>
        <p class="banner-desc" id="challengeDesc"></p>
        <button class="btn-accent" id="btnEnterReplay">進入慢動作重播室檢視</button>
      </div>

      <!-- 九局比賽結束彈窗 -->
      <div class="overlay-banner hidden" id="gameOverBanner">
        <div class="banner-tag" style="background: var(--blue);">FINAL｜九局比賽結束</div>
        <h2 class="banner-title" id="gameOverTitle">比賽結束</h2>
        <p class="banner-desc" id="gameOverDesc"></p>
        <button class="btn-primary" id="btnRestartAfterEnd">開始全新九局比賽</button>
      </div>
    </div>

    <!-- 控制區 -->
    <div class="control-panel">
      <div class="status-line">
        <div class="status-text" id="statusText">按下「開始這一球」或空白鍵，以一壘審視角執法。</div>
        <div class="hint-text">快捷鍵：空白鍵開始/播放、A 判 Safe、D 判 Out、左右鍵逐格微調</div>
      </div>

      <div class="action-row single" id="startRow">
        <button class="btn-primary" id="btnStart">▶ 開始這一球（一壘審視角）</button>
      </div>

      <div class="action-row" id="judgeRow" style="display: none;">
        <button class="btn-safe" id="btnSafe">SAFE 安全上壘 (A)</button>
        <button class="btn-out" id="btnOut">OUT 出局 (D)</button>
      </div>

      <div class="replay-box hidden" id="replayBox">
        <div class="replay-top">
          <div class="btn-group">
            <span class="replay-badge" id="replayBadge">● REPLAY REVIEW 重播輔助判決</span>
            <span id="replaySubInfo" style="font-size: 0.84rem; color: var(--muted);"></span>
          </div>
          <div class="replay-time" id="replayTimeDisplay">0.000s / 2.100s</div>
        </div>

        <input type="range" id="replayScrubber" class="scrubber" min="0" max="2100" value="0" step="1" />

        <div class="replay-controls">
          <div class="btn-group">
            <button class="btn-sm" id="btnReplayPlay">▶ 播放</button>
            <button class="btn-sm" id="btnStepBack">⏪ -1 影格</button>
            <button class="btn-sm" id="btnStepFwd">⏩ +1 影格</button>
            <button class="btn-sm" id="btnJumpImpact">🎯 跳至關鍵瞬間</button>
            <button class="btn-sm" id="btnZoom">🔍 壘包特寫：開</button>
          </div>
          <div class="btn-group">
            <span style="font-size: 0.78rem; color: var(--muted);">倍速：</span>
            <button class="btn-sm speed-btn" data-speed="0.1">0.1x</button>
            <button class="btn-sm speed-btn active" data-speed="0.25">0.25x</button>
            <button class="btn-sm speed-btn" data-speed="0.5">0.5x</button>
            <button class="btn-sm speed-btn" data-speed="1">1.0x</button>
          </div>
        </div>

        <div class="action-row" id="replayDecisionRow">
          <button class="btn-primary" id="btnCallStands">維持原判</button>
          <button class="btn-accent" id="btnCallOverturned">改判</button>
        </div>
      </div>

      <div class="result-box hidden" id="resultBox">
        <div class="result-headline" id="resultHeadline">判決結果</div>
        <div class="result-grid">
          <div class="result-item">
            <div class="k">系統實際結果</div>
            <div class="v" id="resTruth">--</div>
          </div>
          <div class="result-item">
            <div class="k">跑者觸壘時間</div>
            <div class="v" id="resRunnerTime">--</div>
          </div>
          <div class="result-item">
            <div class="k">球進手套時間</div>
            <div class="v" id="resBallTime">--</div>
          </div>
          <div class="result-item">
            <div class="k">關鍵時間差</div>
            <div class="v" id="resDelta">--</div>
          </div>
          <div class="result-item">
            <div class="k">局勢變化</div>
            <div class="v" id="resImpact">--</div>
          </div>
        </div>
        <div class="action-row">
          <button class="btn-ghost" id="btnInspectAfter">🔎 賽後慢動作重播確認</button>
          <button class="btn-primary" id="btnNextPlay">▶ 下一球 (空白鍵)</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      const ui = {
        rowAway: document.getElementById('rowAway'),
        rowHome: document.getElementById('rowHome'),
        scoreAway: document.getElementById('scoreAway'),
        scoreHome: document.getElementById('scoreHome'),
        chalAway: document.getElementById('chalAway'),
        chalHome: document.getElementById('chalHome'),
        inningDisplay: document.getElementById('inningDisplay'),
        outDots: [
          document.getElementById('outDot1'),
          document.getElementById('outDot2'),
          document.getElementById('outDot3')
        ],
        miniB1: document.getElementById('miniB1'),
        miniB2: document.getElementById('miniB2'),
        miniB3: document.getElementById('miniB3'),
        statTotal: document.getElementById('statTotal'),
        statInitial: document.getElementById('statInitial'),
        statFinal: document.getElementById('statFinal'),
        baseBtns: document.querySelectorAll('.btn-tab'),
        btnSound: document.getElementById('btnSound'),
        btnNewGame: document.getElementById('btnNewGame'),
        challengeBanner: document.getElementById('challengeBanner'),
        challengeTitle: document.getElementById('challengeTitle'),
        challengeDesc: document.getElementById('challengeDesc'),
        btnEnterReplay: document.getElementById('btnEnterReplay'),
        gameOverBanner: document.getElementById('gameOverBanner'),
        gameOverTitle: document.getElementById('gameOverTitle'),
        gameOverDesc: document.getElementById('gameOverDesc'),
        btnRestartAfterEnd: document.getElementById('btnRestartAfterEnd'),
        statusText: document.getElementById('statusText'),
        startRow: document.getElementById('startRow'),
        btnStart: document.getElementById('btnStart'),
        judgeRow: document.getElementById('judgeRow'),
        btnSafe: document.getElementById('btnSafe'),
        btnOut: document.getElementById('btnOut'),
        replayBox: document.getElementById('replayBox'),
        replayBadge: document.getElementById('replayBadge'),
        replaySubInfo: document.getElementById('replaySubInfo'),
        replayTimeDisplay: document.getElementById('replayTimeDisplay'),
        replayScrubber: document.getElementById('replayScrubber'),
        btnReplayPlay: document.getElementById('btnReplayPlay'),
        btnStepBack: document.getElementById('btnStepBack'),
        btnStepFwd: document.getElementById('btnStepFwd'),
        btnJumpImpact: document.getElementById('btnJumpImpact'),
        btnZoom: document.getElementById('btnZoom'),
        speedBtns: document.querySelectorAll('.speed-btn'),
        replayDecisionRow: document.getElementById('replayDecisionRow'),
        btnCallStands: document.getElementById('btnCallStands'),
        btnCallOverturned: document.getElementById('btnCallOverturned'),
        resultBox: document.getElementById('resultBox'),
        resultHeadline: document.getElementById('resultHeadline'),
        resTruth: document.getElementById('resTruth'),
        resRunnerTime: document.getElementById('resRunnerTime'),
        resBallTime: document.getElementById('resBallTime'),
        resDelta: document.getElementById('resDelta'),
        resImpact: document.getElementById('resImpact'),
        btnInspectAfter: document.getElementById('btnInspectAfter'),
        btnNextPlay: document.getElementById('btnNextPlay')
      };

      const DURATION = 2.1;
      const BASE_LABELS = { 1: '一壘審視角', 2: '二壘審視角', 3: '三壘審視角' };

      const state = {
        phase: 'IDLE', // IDLE, LIVE, AWAIT_JUDGE, CHALLENGE_BANNER, REPLAY_REVIEW, RESULT, GAME_OVER
        selectedBaseMode: '1', // '1', '2', '3', 'random'
        previewBase: 1,
        soundEnabled: true,

        // 九局制比賽狀態
        game: {
          inning: 1,
          isTop: true, // true: 客隊(紅)進攻, false: 主隊(藍)進攻
          outs: 0,
          bases: [false, false, false], // [1B, 2B, 3B]
          scoreAway: 0,
          scoreHome: 0,
          challengesAway: 1,
          challengesHome: 1
        },

        stats: {
          total: 0,
          initialCorrect: 0,
          finalCorrect: 0
        },

        play: null,
        t: 0,
        lastTimestamp: 0,
        playing: false,
        playbackRate: 1,
        replayZoom: true,
        freeInspectMode: false,
        initialCall: null,
        finalCall: null,
        challenged: false,
        challengingSide: null, // 'away' | 'home'
        triggeredCatchSound: false,
        triggeredTouchSound: false,
        triggeredSlideSound: false
      };

      // ================= Web Audio API 音效引擎 =================
      let audioCtx = null;

      function ensureAudio() {
        if (!state.soundEnabled) return null;
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      }

      function playGlovePop(slowMo = false) {
        const ctxA = ensureAudio();
        if (!ctxA) return;
        const now = ctxA.currentTime;

        const osc = ctxA.createOscillator();
        const gain = ctxA.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(slowMo ? 165 : 240, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.085);
        gain.gain.setValueAtTime(0.55, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
        osc.connect(gain);
        gain.connect(ctxA.destination);
        osc.start(now);
        osc.stop(now + 0.1);

        const len = Math.floor(ctxA.sampleRate * 0.06);
        const buf = ctxA.createBuffer(1, len, ctxA.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.24));
        const noise = ctxA.createBufferSource();
        noise.buffer = buf;
        const filter = ctxA.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = slowMo ? 900 : 1450;
        filter.Q.value = 1.4;
        const ng = ctxA.createGain();
        ng.gain.setValueAtTime(0.65, now);
        ng.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        noise.connect(filter);
        filter.connect(ng);
        ng.connect(ctxA.destination);
        noise.start(now);
      }

      function playBaseTouch(slowMo = false) {
        const ctxA = ensureAudio();
        if (!ctxA) return;
        const now = ctxA.currentTime;
        const osc = ctxA.createOscillator();
        const gain = ctxA.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(slowMo ? 95 : 135, now);
        osc.frequency.exponentialRampToValueAtTime(38, now + 0.11);
        gain.gain.setValueAtTime(0.46, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(gain);
        gain.connect(ctxA.destination);
        osc.start(now);
        osc.stop(now + 0.13);
      }

      function playSlideDirt() {
        const ctxA = ensureAudio();
        if (!ctxA) return;
        const now = ctxA.currentTime;
        const dur = 0.3;
        const len = Math.floor(ctxA.sampleRate * dur);
        const buf = ctxA.createBuffer(1, len, ctxA.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.sin((i / len) * Math.PI);
        const noise = ctxA.createBufferSource();
        noise.buffer = buf;
        const filter = ctxA.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1050, now);
        filter.frequency.linearRampToValueAtTime(420, now + dur);
        const ng = ctxA.createGain();
        ng.gain.setValueAtTime(0.18, now);
        ng.gain.exponentialRampToValueAtTime(0.001, now + dur);
        noise.connect(filter);
        filter.connect(ng);
        ng.connect(ctxA.destination);
        noise.start(now);
      }

      function playTone(freq, dur = 0.12, type = 'sine', vol = 0.18) {
        const ctxA = ensureAudio();
        if (!ctxA) return;
        const now = ctxA.currentTime;
        const osc = ctxA.createOscillator();
        const gain = ctxA.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(gain);
        gain.connect(ctxA.destination);
        osc.start(now);
        osc.stop(now + dur + 0.01);
      }

      function playChallengeAlarm() {
        playTone(510, 0.14, 'sawtooth', 0.13);
        setTimeout(() => playTone(380, 0.24, 'sawtooth', 0.15), 150);
      }

      function playResultChime(ok) {
        if (ok) {
          playTone(587.33, 0.11, 'triangle', 0.2);
          setTimeout(() => playTone(880, 0.2, 'triangle', 0.2), 110);
        } else {
          playTone(250, 0.15, 'sawtooth', 0.13);
          setTimeout(() => playTone(185, 0.25, 'sawtooth', 0.13), 155);
        }
      }

      // ================= 九局記分板與賽況更新 =================
      function updateScoreboardUI() {
        const g = state.game;
        ui.scoreAway.textContent = g.scoreAway;
        ui.scoreHome.textContent = g.scoreHome;
        ui.chalAway.textContent = `挑戰權：${g.challengesAway}`;
        ui.chalHome.textContent = `挑戰權：${g.challengesHome}`;

        ui.rowAway.classList.toggle('batting', g.isTop);
        ui.rowHome.classList.toggle('batting', !g.isTop);
        ui.inningDisplay.textContent = `${g.inning}局${g.isTop ? '上' : '下'}`;

        ui.outDots.forEach((dot, idx) => {
          dot.classList.toggle('on', idx < g.outs);
        });

        ui.miniB1.classList.toggle('on', g.bases[0]);
        ui.miniB2.classList.toggle('on', g.bases[1]);
        ui.miniB3.classList.toggle('on', g.bases[2]);

        const s = state.stats;
        ui.statTotal.textContent = s.total;
        ui.statInitial.textContent = s.total ? Math.round((s.initialCorrect / s.total) * 100) + '%' : '--%';
        ui.statFinal.textContent = s.total ? Math.round((s.finalCorrect / s.total) * 100) + '%' : '--%';
      }

      function applyCallToGame(finalCall) {
        const g = state.game;
        let impactText = '';

        if (finalCall === 'SAFE') {
          if (g.bases[0] && g.bases[1] && g.bases[2]) {
            // 滿壘情況下 SAFE -> 得分 +1，維持滿壘
            if (g.isTop) g.scoreAway += 1;
            else g.scoreHome += 1;
            impactText = `滿壘推進！${g.isTop ? '客隊' : '主隊'} 攻下 1 分！`;
          } else if (g.bases[0] && g.bases[1]) {
            g.bases[2] = true;
            impactText = '安全上壘，形成滿壘危機！';
          } else if (g.bases[0]) {
            g.bases[1] = true;
            impactText = '安全上壘，攻佔一、二壘！';
          } else {
            g.bases[0] = true;
            impactText = '安全上壘，跑者站上一壘！';
          }
        } else {
          g.outs += 1;
          if (g.outs >= 3) {
            const endedHalf = `${g.inning}局${g.isTop ? '上' : '下'}`;
            g.outs = 0;
            g.bases = [false, false, false];

            if (g.isTop) {
              // 9局上結束且主隊已領先 -> 提前結束比賽
              if (g.inning === 9 && g.scoreHome > g.scoreAway) {
                impactText = `三出局！${endedHalf}結束，主隊領先贏得比賽！`;
                updateScoreboardUI();
                showGameOver();
                return impactText;
              }
              g.isTop = false;
              impactText = `三出局！${endedHalf}結束，攻守交換進入 ${g.inning}局下。`;
            } else {
              if (g.inning >= 9) {
                impactText = `三出局！九局比賽正式結束！`;
                updateScoreboardUI();
                showGameOver();
                return impactText;
              }
              g.isTop = true;
              g.inning += 1;
              impactText = `三出局！${endedHalf}結束，進入 ${g.inning}局上。`;
            }
          } else {
            impactText = `出局！目前 ${g.outs} 出局。`;
          }
        }

        // 若九局下主隊靠滿壘得分超前（再見分）
        if (!g.isTop && g.inning === 9 && g.scoreHome > g.scoreAway) {
          impactText += ' 主隊攻下再見分獲勝！';
          updateScoreboardUI();
          showGameOver();
          return impactText;
        }

        updateScoreboardUI();
        return impactText;
      }

      function showGameOver() {
        state.phase = 'GAME_OVER';
        const g = state.game;
        let winner = '雙方握手言和！';
        if (g.scoreAway > g.scoreHome) winner = '客隊（紅鷹）獲勝！';
        else if (g.scoreHome > g.scoreAway) winner = '主隊（藍鯨）獲勝！';

        const acc = state.stats.total ? Math.round((state.stats.finalCorrect / state.stats.total) * 100) : 0;
        let grade = 'C';
        if (acc >= 95) grade = 'S（大聯盟級金眼）';
        else if (acc >= 85) grade = 'A（優秀執法）';
        else if (acc >= 70) grade = 'B（合格壘審）';
        else grade = 'C（需要多練眼力）';

        ui.gameOverTitle.textContent = `${winner}（客 ${g.scoreAway} : ${g.scoreHome} 主）`;
        ui.gameOverDesc.textContent = `本場共執法 ${state.stats.total} 球，最終判決正確率 ${acc}%，壘審評價：${grade}。`;
        ui.gameOverBanner.classList.remove('hidden');
      }

      function resetFullGame() {
        state.phase = 'IDLE';
        state.playing = false;
        state.play = null;
        state.game = {
          inning: 1,
          isTop: true,
          outs: 0,
          bases: [false, false, false],
          scoreAway: 0,
          scoreHome: 0,
          challengesAway: 1,
          challengesHome: 1
        };
        state.stats = { total: 0, initialCorrect: 0, finalCorrect: 0 };
        ui.challengeBanner.classList.add('hidden');
        ui.gameOverBanner.classList.add('hidden');
        ui.replayBox.classList.add('hidden');
        ui.resultBox.classList.add('hidden');
        ui.judgeRow.style.display = 'none';
        ui.startRow.style.display = 'grid';
        updateScoreboardUI();
        updateStartButtonLabel();
        ui.statusText.textContent = '新賽局已就緒！按下「開始這一球」開始九局執法。';
      }

      // ================= 產生三種獨立壘審視角 Play =================
      function pickActiveBase() {
        if (state.selectedBaseMode === 'random') {
          return Math.floor(Math.random() * 3) + 1;
        }
        return parseInt(state.selectedBaseMode, 10);
      }

      function generatePlay() {
        const base = pickActiveBase();
        state.previewBase = base;
        const baseTouchTime = 1.15 + Math.random() * 0.25;

        // 隨機時間差：高比例緊張接近球
        const r = Math.random();
        let absDelta;
        if (r < 0.45) {
          absDelta = 0.015 + Math.random() * 0.035; // 15~50ms 極接近
        } else if (r < 0.80) {
          absDelta = 0.05 + Math.random() * 0.065;  // 50~115ms 接近
        } else {
          absDelta = 0.115 + Math.random() * 0.10;  // 115~215ms 較明顯
        }

        const isSafe = Math.random() < 0.5;
        const delta = isSafe ? absDelta : -absDelta;
        const ballCatchTime = baseTouchTime + delta;

        // 依上下半局決定攻守隊伍顏色
        const runnerTeam = state.game.isTop
          ? { jersey: '#dc2626', helmet: '#991b1b', accent: '#fca5a5', name: '客隊' }
          : { jersey: '#2563eb', helmet: '#1e3a8a', accent: '#93c5fd', name: '主隊' };
        const fielderTeam = state.game.isTop
          ? { jersey: '#2563eb', cap: '#1e3a8a', accent: '#93c5fd', name: '主隊' }
          : { jersey: '#dc2626', cap: '#991b1b', accent: '#fca5a5', name: '客隊' };

        // 三個壘審視角的專屬 2.5D 幾何座標（壘包皆位於畫面焦點 480, 382）
        const basePos = { x: 480, y: 382 };
        let cfg;

        if (base === 1) {
          // 一壘審視角：站在界外區看一壘，跑者從左下方本壘衝向右上方，傳球從右上方內野飛來
          cfg = {
            base: 1,
            viewLabel: '一壘審視角（界外低角度）',
            runnerAction: 'sprint',
            runnerStart: { x: 85, y: 500 },
            runnerContact: { x: 454, y: 388 }, // 踩上一壘壘包左前緣
            runnerEnd: { x: 760, y: 295 },
            throwStart: { x: 890, y: 245 },
            glovePos: { x: 526, y: 325 },     // 一壘手向右上方拉弓接球
            fielderAnchor: { x: 492, y: 376 }, // 一壘手腳踩壘包內側
            fielderFacing: 1,                  // 面向右（內野方向）
            throwDuration: 0.72
          };
        } else if (base === 2) {
          // 二壘審視角：站在內野草皮看二壘與中外野大牆，跑者從右側（一壘方向）滑向二壘，球從左下方傳來
          cfg = {
            base: 2,
            viewLabel: '二壘審視角（內野正面看中外野）',
            runnerAction: 'slide',
            runnerStart: { x: 880, y: 405 },
            runnerContact: { x: 506, y: 382 }, // 腳尖碰觸二壘右側
            runnerEnd: { x: 492, y: 382 },
            throwStart: { x: 75, y: 485 },
            glovePos: { x: 484, y: 360 },      // 守備員接球並下壓觸殺
            fielderAnchor: { x: 462, y: 374 },
            fielderFacing: 1,
            throwDuration: 0.74
          };
        } else {
          // 三壘審視角：站在三壘界外區看三壘與外野，跑者從右上方（二壘方向）滑向三壘，球從左上方外野傳來
          cfg = {
            base: 3,
            viewLabel: '三壘審視角（三壘界外看外野）',
            runnerAction: 'slide',
            runnerStart: { x: 830, y: 290 },
            runnerContact: { x: 502, y: 374 }, // 腳尖碰觸三壘右上緣
            runnerEnd: { x: 492, y: 378 },
            throwStart: { x: 110, y: 225 },
            glovePos: { x: 472, y: 356 },
            fielderAnchor: { x: 454, y: 376 },
            fielderFacing: -1,
            throwDuration: 0.74
          };
        }

        return {
          ...cfg,
          basePos,
          runnerTeam,
          fielderTeam,
          baseTouchTime,
          ballCatchTime,
          delta,
          truth: isSafe ? 'SAFE' : 'OUT',
          throwStartTime: ballCatchTime - cfg.throwDuration
        };
      }

      // ================= 嚴謹的教練挑戰邏輯 =================
      function shouldCoachChallenge(initialCall) {
        const isInitialCorrect = initialCall === state.play.truth;
        const absDelta = Math.abs(state.play.delta);

        // 誰會提出挑戰？判 SAFE -> 守備方不服；判 OUT -> 進攻方不服
        const offenseSide = state.game.isTop ? 'away' : 'home';
        const defenseSide = state.game.isTop ? 'home' : 'away';
        const challenger = initialCall === 'SAFE' ? defenseSide : offenseSide;

        // 檢查該隊是否還有挑戰權
        const remaining = challenger === 'away' ? state.game.challengesAway : state.game.challengesHome;
        if (remaining <= 0) {
          return { challenged: false, challenger: null };
        }

        // 嚴謹條件：
        // 1. 若玩家判對：只有在「極度接近（<= 42 毫秒）」的肉眼難辨球才有可能挑戰（45% 機率）；差距超過 42ms 絕不亂挑戰！
        // 2. 若玩家判錯：教練在場邊看回放發現明顯誤判，只要差距 >= 25ms 幾乎必挑戰（92%），極接近球也有 75% 挑戰。
        let prob = 0;
        if (isInitialCorrect) {
          prob = absDelta <= 0.042 ? 0.45 : 0;
        } else {
          prob = absDelta >= 0.025 ? 0.92 : 0.75;
        }

        return {
          challenged: Math.random() < prob,
          challenger
        };
      }

      // ================= 遊戲流程控制 =================
      function updateStartButtonLabel() {
        const label = state.selectedBaseMode === 'random'
          ? '隨機壘審視角'
          : BASE_LABELS[state.selectedBaseMode];
        ui.btnStart.textContent = `▶ 開始這一球（${label}）`;
      }

      function startNewPlay() {
        if (state.phase === 'GAME_OVER') return;
        ensureAudio();
        state.play = generatePlay();
        state.phase = 'LIVE';
        state.t = 0;
        state.playing = true;
        state.playbackRate = 1;
        state.freeInspectMode = false;
        state.initialCall = null;
        state.finalCall = null;
        state.challenged = false;
        state.challengingSide = null;
        state.triggeredCatchSound = false;
        state.triggeredTouchSound = false;
        state.triggeredSlideSound = false;

        ui.challengeBanner.classList.add('hidden');
        ui.replayBox.classList.add('hidden');
        ui.resultBox.classList.add('hidden');
        ui.startRow.style.display = 'none';
        ui.judgeRow.style.display = 'grid';
        ui.btnSafe.disabled = true;
        ui.btnOut.disabled = true;

        ui.statusText.textContent = `【${state.play.viewLabel}】比賽進行中！緊盯壘包與接球瞬間...`;
        playTone(660, 0.08, 'sine', 0.14);
      }

      function handleInitialCall(call) {
        if (state.phase !== 'AWAIT_JUDGE' && state.phase !== 'LIVE') return;
        state.initialCall = call;
        state.playing = false;
        ui.judgeRow.style.display = 'none';

        const check = shouldCoachChallenge(call);
        if (check.challenged) {
          state.challenged = true;
          state.challengingSide = check.challenger;
          state.phase = 'CHALLENGE_BANNER';
          const coachName = check.challenger === 'away' ? '客隊（紅鷹）總教練' : '主隊（藍鯨）總教練';
          ui.challengeTitle.textContent = `${coachName}提出重播輔助判決！`;
          ui.challengeDesc.textContent = `你剛才宣判「${call === 'SAFE' ? 'SAFE 安全上壘' : 'OUT 出局'}」。請親自進入重播室使用慢動作與逐格功能做出最終裁決。`;
          ui.challengeBanner.classList.remove('hidden');
          ui.statusText.textContent = `${coachName}不服原判（${call}），提出電視輔助判決！`;
          playChallengeAlarm();
        } else {
          state.challenged = false;
          state.finalCall = call;
          finalizeRound();
        }
      }

      function enterReplayReview() {
        ui.challengeBanner.classList.add('hidden');
        state.phase = 'REPLAY_REVIEW';
        state.freeInspectMode = false;
        state.replayZoom = true;
        state.playbackRate = 0.25;
        setSpeedBtnActive(0.25);
        ui.btnZoom.textContent = '🔍 壘包特寫：開';

        const keyMoment = Math.min(state.play.baseTouchTime, state.play.ballCatchTime);
        jumpReplayTime(Math.max(0, keyMoment - 0.28));
        state.playing = true;
        ui.btnReplayPlay.textContent = '⏸ 暫停';

        ui.replayBadge.textContent = '● REPLAY REVIEW 重播輔助判決';
        ui.replaySubInfo.textContent = `原判：${state.initialCall === 'SAFE' ? 'SAFE 安全上壘' : 'OUT 出局'}`;
        ui.replayDecisionRow.style.display = 'grid';
        const overturnedCall = state.initialCall === 'SAFE' ? 'OUT' : 'SAFE';
        ui.btnCallStands.textContent = `維持原判（${state.initialCall}）`;
        ui.btnCallOverturned.textContent = `改判（改為 ${overturnedCall}）`;

        ui.replayBox.classList.remove('hidden');
        ui.statusText.textContent = '操作慢動作與逐格重播，確認後選擇「維持原判」或「改判」。';
      }

      function handleReplayDecision(overturn) {
        if (state.phase !== 'REPLAY_REVIEW') return;
        state.playing = false;
        state.finalCall = overturn
          ? (state.initialCall === 'SAFE' ? 'OUT' : 'SAFE')
          : state.initialCall;

        // 若維持原判，提出挑戰的球隊消耗 1 次挑戰權；改判則保留挑戰權
        if (!overturn && state.challengingSide) {
          if (state.challengingSide === 'away') state.game.challengesAway = Math.max(0, state.game.challengesAway - 1);
          else state.game.challengesHome = Math.max(0, state.game.challengesHome - 1);
        }

        finalizeRound();
      }

      function finalizeRound() {
        state.phase = 'RESULT';
        state.playing = false;
        ui.replayBox.classList.add('hidden');
        ui.resultBox.classList.remove('hidden');

        const truth = state.play.truth;
        const initOk = state.initialCall === truth;
        const finalOk = state.finalCall === truth;

        state.stats.total += 1;
        if (initOk) state.stats.initialCorrect += 1;
        if (finalOk) state.stats.finalCorrect += 1;

        playResultChime(finalOk);

        const impactText = applyCallToGame(state.finalCall);

        let headline = '';
        if (!state.challenged) {
          headline = finalOk
            ? `✅ 判決精準！（原判 ${state.finalCall} 正確）`
            : `❌ 誤判了！（你判 ${state.finalCall}，實際為 ${truth}）`;
        } else {
          if (finalOk && initOk) {
            headline = `✅ 挑戰失敗！重播維持原判 ${truth} 正確（對方失去挑戰權）`;
          } else if (finalOk && !initOk) {
            headline = `✅ 挑戰成功！重播即時改判 ${truth} 正確（對方保留挑戰權）`;
          } else if (!finalOk && initOk) {
            headline = `❌ 重播改錯了！原本判 ${state.initialCall} 才是正確的！`;
          } else {
            headline = `❌ 維持誤判！實際結果應為 ${truth}。`;
          }
        }

        ui.resultHeadline.textContent = headline;
        ui.resultHeadline.className = 'result-headline ' + (finalOk ? 'good' : 'bad');
        ui.resTruth.textContent = truth === 'SAFE' ? 'SAFE（安全上壘）' : 'OUT（出局）';
        ui.resTruth.style.color = truth === 'SAFE' ? '#46e095' : '#ff6b6b';
        ui.resRunnerTime.textContent = `${state.play.baseTouchTime.toFixed(3)} 秒`;
        ui.resBallTime.textContent = `${state.play.ballCatchTime.toFixed(3)} 秒`;

        const diffMs = Math.round(Math.abs(state.play.delta) * 1000);
        const whoFirst = state.play.delta > 0 ? '跑者先到' : '球先入套';
        ui.resDelta.textContent = `${diffMs} 毫秒（${whoFirst}）`;
        ui.resImpact.textContent = impactText;

        if (state.phase !== 'GAME_OVER') {
          ui.statusText.textContent = '本球裁決完成，可點選「下一球」繼續執法。';
        }
      }

      function openFreeInspect() {
        state.freeInspectMode = true;
        state.replayZoom = true;
        state.playbackRate = 0.25;
        setSpeedBtnActive(0.25);
        ui.btnZoom.textContent = '🔍 壘包特寫：開';
        ui.replayBadge.textContent = '● 賽後自由檢視模式';
        ui.replaySubInfo.textContent = `實際答案：${state.play.truth}`;
        ui.replayDecisionRow.style.display = 'none';
        ui.replayBox.classList.remove('hidden');

        const keyMoment = Math.min(state.play.baseTouchTime, state.play.ballCatchTime);
        jumpReplayTime(Math.max(0, keyMoment - 0.25));
        state.playing = false;
        ui.btnReplayPlay.textContent = '▶ 播放';
      }

      function jumpReplayTime(newT) {
        state.t = Math.max(0, Math.min(DURATION, newT));
        state.triggeredCatchSound = state.t >= state.play.ballCatchTime;
        state.triggeredTouchSound = state.t >= state.play.baseTouchTime;
        state.triggeredSlideSound = state.t >= state.play.baseTouchTime - 0.34;
        updateReplayScrubberUI();
      }

      function updateReplayScrubberUI() {
        ui.replayScrubber.value = Math.round(state.t * 1000);
        ui.replayTimeDisplay.textContent = `${state.t.toFixed(3)}s / ${DURATION.toFixed(3)}s`;
      }

      function setSpeedBtnActive(speed) {
        ui.speedBtns.forEach(btn => {
          btn.classList.toggle('active', parseFloat(btn.dataset.speed) === speed);
        });
      }

      // ================= 2.5D 壘審真實視角與公仔繪圖引擎 =================
      function lerp(a, b, t) { return a + (b - a) * t; }
      function clamp01(v) { return Math.max(0, Math.min(1, v)); }

      function getRunnerPos(play, t) {
        const approachStart = play.baseTouchTime - 0.95;
        if (t <= play.baseTouchTime) {
          const p = clamp01((t - approachStart) / 0.95);
          const eased = play.runnerAction === 'slide' ? 1 - Math.pow(1 - p, 1.35) : p;
          return {
            x: lerp(play.runnerStart.x, play.runnerContact.x, eased),
            y: lerp(play.runnerStart.y, play.runnerContact.y, eased),
            sliding: play.runnerAction === 'slide' && t >= play.baseTouchTime - 0.38
          };
        } else {
          const afterP = clamp01((t - play.baseTouchTime) / 0.65);
          if (play.runnerAction === 'sprint') {
            return {
              x: lerp(play.runnerContact.x, play.runnerEnd.x, afterP),
              y: lerp(play.runnerContact.y, play.runnerEnd.y, afterP),
              sliding: false
            };
          } else {
            const stopP = 1 - Math.pow(1 - afterP, 3);
            return {
              x: lerp(play.runnerContact.x, play.runnerEnd.x, stopP),
              y: lerp(play.runnerContact.y, play.runnerEnd.y, stopP),
              sliding: true
            };
          }
        }
      }

      function getBallPos(play, t) {
        if (t < play.throwStartTime) return { visible: false };
        if (t >= play.ballCatchTime) {
          return { visible: true, x: play.glovePos.x, y: play.glovePos.y, caught: true };
        }
        const p = clamp01((t - play.throwStartTime) / play.throwDuration);
        const x = lerp(play.throwStart.x, play.glovePos.x, p);
        const y = lerp(play.throwStart.y, play.glovePos.y, p);
        const arc = Math.sin(p * Math.PI) * 38;
        return {
          visible: true,
          x,
          y: y - arc,
          groundY: y + 18,
          scale: 0.72 + p * 0.35,
          caught: false
        };
      }

      // 繪製三種不同壘審視角的球場背景與透視地平面
      function drawStadiumPerspective(baseNum) {
        const w = canvas.width;
        const h = canvas.height;
        const horizon = 195;

        // 1. 夜賽/傍晚球場天空漸層
        const skyGrad = ctx.createLinearGradient(0, 0, 0, horizon);
        skyGrad.addColorStop(0, '#0f2138');
        skyGrad.addColorStop(1, '#24476e');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, w, horizon);

        // 球場照明燈柱
        ctx.fillStyle = 'rgba(255, 248, 220, 0.9)';
        const lights = baseNum === 1 ? [180, 720] : baseNum === 2 ? [150, 480, 810] : [240, 780];
        lights.forEach(lx => {
          ctx.fillStyle = '#334155';
          ctx.fillRect(lx - 4, 28, 8, 90);
          ctx.fillStyle = '#fff9db';
          ctx.fillRect(lx - 22, 18, 44, 16);
          const glow = ctx.createRadialGradient(lx, 26, 4, lx, 26, 75);
          glow.addColorStop(0, 'rgba(255,250,220,0.42)');
          glow.addColorStop(1, 'rgba(255,250,220,0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(lx, 26, 75, 0, Math.PI * 2);
          ctx.fill();
        });

        // 2. 依不同壘審視角繪製觀眾席 / 外野全壘打牆 / 記分板
        if (baseNum === 1) {
          // 一壘審視角：遠方為三壘側看台與右外野界外標竿
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(0, 105, w, 90);
          // 觀眾席層次與點狀觀眾
          for (let row = 0; row < 5; row++) {
            ctx.fillStyle = row % 2 === 0 ? '#28364a' : '#33445c';
            ctx.fillRect(0, 112 + row * 15, w, 13);
          }
          // 內野綠色護牆
          ctx.fillStyle = '#164e32';
          ctx.fillRect(0, 178, w, 22);
          ctx.fillStyle = '#f5b942';
          ctx.fillRect(0, 176, w, 3);
        } else if (baseNum === 2) {
          // 二壘審視角：正對中外野全壘打牆與大螢幕
          ctx.fillStyle = '#1a2738';
          ctx.fillRect(0, 115, w, 80);
          // 中外野大螢幕
          ctx.fillStyle = '#0b121b';
          ctx.fillRect(365, 62, 230, 88);
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 3;
          ctx.strokeRect(365, 62, 230, 88);
          ctx.fillStyle = '#38bdf8';
          ctx.font = 'bold 16px monospace';
          ctx.fillText('BASEBALL STADIUM', 398, 92);
          ctx.fillStyle = '#f5b942';
          ctx.font = 'bold 20px monospace';
          ctx.fillText(`AWAY ${state.game.scoreAway}  -  ${state.game.scoreHome} HOME`, 396, 126);
          // 中外野綠色全壘打牆（含打者之眼）
          ctx.fillStyle = '#14532d';
          ctx.fillRect(0, 165, w, 34);
          ctx.fillStyle = '#0f3d21';
          ctx.fillRect(380, 155, 200, 44);
          ctx.fillStyle = '#facc15';
          ctx.fillRect(0, 163, w, 3);
        } else {
          // 三壘審視角：面對右外野看台與一壘側休息室
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(0, 110, w, 85);
          // 右側看台階梯
          for (let row = 0; row < 4; row++) {
            ctx.fillStyle = row % 2 === 0 ? '#2b3a4f' : '#374863';
            ctx.fillRect(300, 118 + row * 16, 660, 14);
          }
          // 左側外野全壘打牆與黃色界外標竿
          ctx.fillStyle = '#14532d';
          ctx.fillRect(0, 168, w, 30);
          ctx.fillStyle = '#facc15';
          ctx.fillRect(108, 45, 6, 152); // 界外標竿
          ctx.fillRect(0, 166, w, 3);
        }

        // 3. 透視草皮地平面
        const grassGrad = ctx.createLinearGradient(0, horizon, 0, h);
        grassGrad.addColorStop(0, '#1e5b31');
        grassGrad.addColorStop(1, '#2f8245');
        ctx.fillStyle = grassGrad;
        ctx.fillRect(0, horizon, w, h - horizon);

        // 透視草皮深淺條紋
        ctx.fillStyle = 'rgba(255,255,255,0.045)';
        for (let i = -3; i <= 6; i++) {
          ctx.beginPath();
          ctx.moveTo(w * 0.5 + i * 95, horizon);
          ctx.lineTo(w * 0.5 + (i + 0.5) * 95, horizon);
          ctx.lineTo(w * 0.5 + (i + 0.5) * 280, h);
          ctx.lineTo(w * 0.5 + i * 280, h);
          ctx.closePath();
          ctx.fill();
        }

        // 4. 依不同壘審視角繪製透視紅土與邊線
        ctx.fillStyle = '#b47445';
        if (baseNum === 1) {
          // 一壘透視紅土區 + 跑壘道（由左下往右上延伸）
          ctx.beginPath();
          ctx.moveTo(0, 445);
          ctx.lineTo(960, 215);
          ctx.lineTo(960, 325);
          ctx.lineTo(290, 540);
          ctx.lineTo(0, 540);
          ctx.closePath();
          ctx.fill();

          // 壘包周圍較深紅土圓盤（透視橢圓）
          ctx.fillStyle = '#a36438';
          ctx.beginPath();
          ctx.ellipse(480, 388, 175, 58, -0.22, 0, Math.PI * 2);
          ctx.fill();

          // 一壘白色界線（從左下穿過一壘延伸至右上方）
          ctx.strokeStyle = 'rgba(255,255,255,0.92)';
          ctx.lineWidth = 7;
          ctx.beginPath();
          ctx.moveTo(15, 512);
          ctx.lineTo(960, 240);
          ctx.stroke();
        } else if (baseNum === 2) {
          // 二壘正面紅土弧形（左右寬闊滑壘區）
          ctx.beginPath();
          ctx.ellipse(480, 415, 470, 125, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#a36438';
          ctx.beginPath();
          ctx.ellipse(480, 386, 180, 48, 0, 0, Math.PI * 2);
          ctx.fill();
          // 遠方投手丘小土堆提示（左下角）
          ctx.fillStyle = '#9c5f34';
          ctx.beginPath();
          ctx.ellipse(90, 515, 80, 26, 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // 三壘透視紅土區（界線由右下穿過三壘往左上方延伸）
          ctx.beginPath();
          ctx.moveTo(0, 225);
          ctx.lineTo(960, 255);
          ctx.lineTo(960, 430);
          ctx.lineTo(640, 540);
          ctx.lineTo(0, 360);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#a36438';
          ctx.beginPath();
          ctx.ellipse(480, 386, 175, 55, 0.2, 0, Math.PI * 2);
          ctx.fill();

          // 三壘白色界線（由右下穿過三壘往左上方延伸至界外標竿）
          ctx.strokeStyle = 'rgba(255,255,255,0.92)';
          ctx.lineWidth = 7;
          ctx.beginPath();
          ctx.moveTo(920, 525);
          ctx.lineTo(110, 196);
          ctx.stroke();
        }

        // 5. 立體白色壘包（透視厚度感）
        draw3DBaseBag(480, 382);
      }

      function draw3DBaseBag(x, y) {
        ctx.save();
        ctx.translate(x, y);
        // 陰影
        ctx.fillStyle = 'rgba(0,0,0,0.32)';
        ctx.beginPath();
        ctx.ellipse(2, 10, 34, 13, 0, 0, Math.PI * 2);
        ctx.fill();

        // 壘包側面厚度
        ctx.fillStyle = '#cbd5e1';
        ctx.beginPath();
        ctx.moveTo(-28, 2);
        ctx.lineTo(0, 14);
        ctx.lineTo(28, 2);
        ctx.lineTo(28, 9);
        ctx.lineTo(0, 21);
        ctx.lineTo(-28, 9);
        ctx.closePath();
        ctx.fill();

        // 壘包頂面
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(0, -10);
        ctx.lineTo(28, 2);
        ctx.lineTo(0, 14);
        ctx.lineTo(-28, 2);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      }

      // 繪製擬真棒球守備員公仔
      function drawFielderFigurine(play, t) {
        const caught = t >= play.ballCatchTime;
        const catchAge = t - play.ballCatchTime;
        const ax = play.fielderAnchor.x;
        const ay = play.fielderAnchor.y;
        const gx = play.glovePos.x;
        const gy = play.glovePos.y;
        const team = play.fielderTeam;

        ctx.save();

        // 地面陰影
        ctx.fillStyle = 'rgba(0,0,0,0.32)';
        ctx.beginPath();
        ctx.ellipse(ax + (play.base === 1 ? 16 : -6), ay + 6, 36, 13, 0, 0, Math.PI * 2);
        ctx.fill();

        if (play.base === 1) {
          // 一壘手：左腳踩壘包 (ax, ay)，身體向右大幅度拉弓劈腿接球
          const hipX = ax + 24;
          const hipY = ay - 36;
          const shoulderX = hipX + 16;
          const shoulderY = hipY - 34;

          // 踩壘後腳（延伸到壘包上）
          drawLimb(hipX, hipY, ax + 6, ay - 14, ax, ay, '#f1f5f9', '#1e293b', 10);
          // 前跨撐地腳
          drawLimb(hipX, hipY, hipX + 26, ay - 16, hipX + 36, ay + 6, '#f1f5f9', '#1e293b', 10);

          // 軀幹球衣
          drawTorso(hipX, hipY, shoulderX, shoulderY, team.jersey, team.accent, '23');

          // 平衡手臂（向後伸展）
          drawLimb(shoulderX - 4, shoulderY + 4, shoulderX - 24, shoulderY + 12, shoulderX - 38, shoulderY + 4, team.jersey, '#f1c29b', 7);

          // 頭部與球帽
          drawHead(shoulderX + 4, shoulderY - 15, team.cap, false, 1);

          // 接球手臂伸向 glovePos
          drawLimb(shoulderX + 4, shoulderY + 4, (shoulderX + gx) / 2, (shoulderY + gy) / 2 + 4, gx, gy, team.jersey, '#f1c29b', 8);
        } else {
          // 二、三壘手：蹲低接球準備觸殺
          const hipX = ax - 8;
          const hipY = ay - 36;
          const shoulderX = hipX + (play.fielderFacing * 6);
          const shoulderY = hipY - 34;

          // 雙腳微蹲站穩
          drawLimb(hipX - 6, hipY, hipX - 18, ay - 16, hipX - 20, ay + 4, '#f1f5f9', '#1e293b', 10);
          drawLimb(hipX + 6, hipY, ax + 2, ay - 16, ax + 6, ay + 2, '#f1f5f9', '#1e293b', 10);

          // 軀幹球衣
          drawTorso(hipX, hipY, shoulderX, shoulderY, team.jersey, team.accent, play.base === 2 ? '6' : '5');

          // 輔助扶手套的手
          drawLimb(shoulderX - 6, shoulderY + 6, gx - 10, gy - 6, gx - 4, gy + 2, team.jersey, '#f1c29b', 7);

          // 頭部與球帽
          drawHead(shoulderX, shoulderY - 15, team.cap, false, play.fielderFacing);

          // 接球觸殺手套臂
          drawLimb(shoulderX + 6, shoulderY + 6, (shoulderX + gx) / 2 + 6, (shoulderY + gy) / 2, gx, gy, team.jersey, '#f1c29b', 8);
        }

        // 棒球手套
        ctx.save();
        ctx.translate(gx, gy);
        const sq = caught && catchAge < 0.14 ? 0.86 : 1;
        ctx.scale(sq, sq);
        ctx.fillStyle = '#8b4513';
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#4a2308';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#5c2d0c';
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 接球衝擊光圈
        if (caught && catchAge >= 0 && catchAge <= 0.22) {
          const p = catchAge / 0.22;
          ctx.strokeStyle = `rgba(255, 224, 102, ${1 - p})`;
          ctx.lineWidth = 3.5 * (1 - p) + 1;
          ctx.beginPath();
          ctx.arc(gx, gy, 12 + p * 26, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.restore();
      }

      // 繪製擬真跑者公仔（精準對齊鞋尖 = pos.x, pos.y）
      function drawRunnerFigurine(play, t) {
        const pos = getRunnerPos(play, t);
        const touchAge = t - play.baseTouchTime;
        const team = play.runnerTeam;

        ctx.save();

        // 依距離透視微調大小（y 越大越靠近鏡頭）
        const depthScale = clamp01((pos.y - 180) / 360) * 0.42 + 0.78;

        ctx.translate(pos.x, pos.y);
        ctx.scale(depthScale, depthScale);

        // 跑動方向：1B 是往右跑 (+1)；2B 和 3B 是往左滑壘 (-1)
        const dir = play.base === 1 ? 1 : -1;

        if (pos.sliding) {
          // 滑壘公仔：前腳鞋尖精準位於 (0, 0)，身體向後方 (-dir) 延伸
          ctx.fillStyle = 'rgba(0,0,0,0.3)';
          ctx.beginPath();
          ctx.ellipse(-dir * 42, 6, 48, 12, 0, 0, Math.PI * 2);
          ctx.fill();

          const hipX = -dir * 44;
          const hipY = -8;
          const shoulderX = -dir * 72;
          const shoulderY = -28;

          // 彎曲的後腳
          drawLimb(hipX, hipY, -dir * 26, -20, -dir * 20, -2, '#f1f5f9', '#111827', 9.5);
          // 筆直前伸的滑壘前腳（鞋尖正好在 0, 0！）
          drawLimb(hipX, hipY, -dir * 22, -4, 0, 0, '#f1f5f9', '#111827', 10);

          // 身體後仰
          drawTorso(hipX, hipY, shoulderX, shoulderY, team.jersey, team.accent, '17');

          // 雙手舉起保持平衡
          drawLimb(shoulderX, shoulderY, shoulderX - dir * 10, shoulderY - 16, shoulderX + dir * 4, shoulderY - 26, team.jersey, '#f1c29b', 7);

          // 打擊頭盔
          drawHead(shoulderX - dir * 6, shoulderY - 14, team.helmet, true, dir);
        } else {
          // 衝刺公仔（一壘直衝）：前跨腳鞋尖精準位於 (0, 0)
          const cycle = Math.sin(t * 26);
          const hipX = -dir * 22;
          const hipY = -44;
          const shoulderX = hipX + dir * 10; // 前傾衝刺
          const shoulderY = hipY - 34;

          ctx.fillStyle = 'rgba(0,0,0,0.3)';
          ctx.beginPath();
          ctx.ellipse(hipX + dir * 6, 4, 28, 10, 0, 0, Math.PI * 2);
          ctx.fill();

          // 後擺腿
          drawLimb(hipX, hipY, hipX - dir * 18, hipY + 20, hipX - dir * (28 + cycle * 12), -6, '#f1f5f9', '#111827', 9.5);

          // 前跨踩壘腿（鞋尖鎖定於 0, 0，讓觸壘點分毫不差）
          drawLimb(hipX, hipY, -dir * 10, -22, 0, 0, '#f1f5f9', '#111827', 10);

          // 擺動後臂
          drawLimb(shoulderX, shoulderY + 4, shoulderX - dir * 16, shoulderY + 18, shoulderX - dir * (22 - cycle * 10), shoulderY + 10, team.jersey, '#f1c29b', 7);

          // 軀幹球衣
          drawTorso(hipX, hipY, shoulderX, shoulderY, team.jersey, team.accent, '17');

          // 前擺臂
          drawLimb(shoulderX + dir * 2, shoulderY + 4, shoulderX + dir * 16, shoulderY + 16, shoulderX + dir * (24 + cycle * 10), shoulderY + 4, team.jersey, '#f1c29b', 7.5);

          // 打擊頭盔
          drawHead(shoulderX + dir * 4, shoulderY - 14, team.helmet, true, dir);
        }

        ctx.restore();

        // 觸壘瞬間揚塵
        if (touchAge >= 0 && touchAge <= 0.28) {
          const p = touchAge / 0.28;
          ctx.save();
          ctx.fillStyle = `rgba(240, 210, 165, ${(1 - p) * 0.72})`;
          for (let i = 0; i < 7; i++) {
            const ang = Math.PI + (i / 6) * Math.PI;
            const r = 8 + p * 28;
            ctx.beginPath();
            ctx.arc(
              play.runnerContact.x + Math.cos(ang) * r,
              play.runnerContact.y + Math.sin(ang) * r * 0.5,
              6 * (1 - p) + 2,
              0,
              Math.PI * 2
            );
            ctx.fill();
          }
          ctx.restore();
        }
      }

      // 公仔元件繪製輔助函式
      function drawLimb(x1, y1, mx, my, x2, y2, upperColor, endColor, width) {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = upperColor;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(mx, my);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        // 末端球鞋或手掌
        ctx.fillStyle = endColor;
        ctx.beginPath();
        ctx.arc(x2, y2, width * 0.55, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawTorso(hx, hy, sx, sy, jerseyColor, accentColor, num) {
        ctx.save();
        ctx.strokeStyle = jerseyColor;
        ctx.lineWidth = 22;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(sx, sy);
        ctx.stroke();

        // 腰帶
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(hx - 8, hy);
        ctx.lineTo(hx + 8, hy);
        ctx.stroke();

        // 球衣背號
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(num, (hx + sx) / 2, (hy + sy) / 2 + 4);
        ctx.restore();
      }

      function drawHead(x, y, hatColor, isHelmet, dir) {
        ctx.save();
        // 臉部
        ctx.fillStyle = '#f1c29b';
        ctx.beginPath();
        ctx.arc(x, y, 10.5, 0, Math.PI * 2);
        ctx.fill();

        // 頭盔或球帽
        ctx.fillStyle = hatColor;
        ctx.beginPath();
        ctx.arc(x, y - 2, 11.2, Math.PI, Math.PI * 2);
        ctx.fill();

        // 帽簷
        ctx.fillRect(dir > 0 ? x : x - 14, y - 5, 14, 3.5);
        if (isHelmet) {
          // 護耳蓋
          ctx.beginPath();
          ctx.arc(x - dir * 4, y + 2, 5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawBall(play, t) {
        const b = getBallPos(play, t);
        if (!b.visible) return;
        ctx.save();
        if (!b.caught) {
          // 地面陰影
          ctx.fillStyle = 'rgba(0,0,0,0.28)';
          ctx.beginPath();
          ctx.ellipse(b.x, b.groundY, 7, 3, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        const r = b.caught ? 6.2 : 6.8 * (b.scale || 1);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#dc2626';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(b.x - 1.5, b.y, r * 0.65, -0.8, 0.8);
        ctx.stroke();
        ctx.restore();
      }

      function drawHUD() {
        const w = canvas.width;
        const h = canvas.height;
        const isReplay = state.phase === 'REPLAY_REVIEW' || state.freeInspectMode;
        const activeBase = state.play ? state.play.base : state.previewBase;

        ctx.save();
        ctx.fillStyle = 'rgba(11, 19, 30, 0.78)';
        ctx.fillRect(14, 14, 246, 34);
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.strokeRect(14, 14, 246, 34);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText(`🎥 ${BASE_LABELS[activeBase]}（${activeBase}B）`, 24, 36);

        if (isReplay) {
          ctx.strokeStyle = 'rgba(230, 69, 69, 0.9)';
          ctx.lineWidth = 6;
          ctx.strokeRect(3, 3, w - 6, h - 6);

          ctx.fillStyle = 'rgba(201, 42, 42, 0.92)';
          ctx.fillRect(w - 235, 14, 221, 34);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 14px monospace';
          ctx.fillText(`● REPLAY ${state.playbackRate}x  ${state.t.toFixed(3)}s`, w - 224, 36);

          if (state.replayZoom) {
            ctx.fillStyle = 'rgba(11, 19, 30, 0.78)';
            ctx.fillRect(w - 148, h - 44, 134, 28);
            ctx.fillStyle = '#f5b942';
            ctx.font = 'bold 13px sans-serif';
            ctx.fillText('🔍 2.1x 壘包特寫', w - 136, h - 25);
          }
        }
        ctx.restore();
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const activeBase = state.play ? state.play.base : state.previewBase;
        const isReplayZoom = (state.phase === 'REPLAY_REVIEW' || state.freeInspectMode) && state.replayZoom && state.play;

        ctx.save();
        if (isReplayZoom) {
          const zoom = 2.1;
          const cx = 480;
          const cy = 360;
          ctx.translate(canvas.width / 2, canvas.height / 2);
          ctx.scale(zoom, zoom);
          ctx.translate(-cx, -cy);
        }

        drawStadiumPerspective(activeBase);

        if (state.play) {
          // 依前後層次繪製守備員、跑者與球
          drawFielderFigurine(state.play, state.t);
          drawRunnerFigurine(state.play, state.t);
          drawBall(state.play, state.t);
        }

        ctx.restore();
        drawHUD();
      }

      // ================= 主動畫迴圈 =================
      function loop(timestamp) {
        if (!state.lastTimestamp) state.lastTimestamp = timestamp;
        const dt = Math.min(0.05, (timestamp - state.lastTimestamp) / 1000);
        state.lastTimestamp = timestamp;

        if (state.playing && state.play) {
          const prevT = state.t;
          state.t += dt * state.playbackRate;
          const isSlow = state.playbackRate < 0.8;

          if (
            state.play.runnerAction === 'slide' &&
            !state.triggeredSlideSound &&
            prevT < state.play.baseTouchTime - 0.34 &&
            state.t >= state.play.baseTouchTime - 0.34
          ) {
            state.triggeredSlideSound = true;
            if (!isSlow) playSlideDirt();
          }

          if (!state.triggeredCatchSound && prevT < state.play.ballCatchTime && state.t >= state.play.ballCatchTime) {
            state.triggeredCatchSound = true;
            playGlovePop(isSlow);
          }

          if (!state.triggeredTouchSound && prevT < state.play.baseTouchTime && state.t >= state.play.baseTouchTime) {
            state.triggeredTouchSound = true;
            playBaseTouch(isSlow);
          }

          if (state.phase === 'LIVE') {
            const firstEvent = Math.min(state.play.ballCatchTime, state.play.baseTouchTime);
            if (state.t >= firstEvent + 0.08 && ui.btnSafe.disabled) {
              ui.btnSafe.disabled = false;
              ui.btnOut.disabled = false;
              ui.statusText.textContent = '關鍵瞬間已發生！請立刻宣判 SAFE 或 OUT！';
            }
          }

          if (state.t >= DURATION) {
            state.t = DURATION;
            state.playing = false;
            if (state.phase === 'LIVE') {
              state.phase = 'AWAIT_JUDGE';
              ui.btnSafe.disabled = false;
              ui.btnOut.disabled = false;
              ui.statusText.textContent = '請做出你的壘審判決：SAFE 或 OUT？';
            } else if (state.phase === 'REPLAY_REVIEW' || state.freeInspectMode) {
              ui.btnReplayPlay.textContent = '▶ 重播';
            }
          }

          if (state.phase === 'REPLAY_REVIEW' || state.freeInspectMode) {
            updateReplayScrubberUI();
          }
        }

        render();
        requestAnimationFrame(loop);
      }

      // ================= 事件綁定 =================
      ui.baseBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          ui.baseBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.selectedBaseMode = btn.dataset.base;
          if (btn.dataset.base !== 'random') {
            state.previewBase = parseInt(btn.dataset.base, 10);
          }
          updateStartButtonLabel();
          // 若目前不在進行中，立刻切換畫面預覽該壘審視角
          if (state.phase === 'IDLE' || state.phase === 'RESULT') {
            if (state.phase === 'IDLE') state.play = null;
            render();
          }
        });
      });

      ui.btnSound.addEventListener('click', () => {
        state.soundEnabled = !state.soundEnabled;
        ui.btnSound.textContent = state.soundEnabled ? '🔊 音效：開' : '🔇 音效：關';
      });

      ui.btnNewGame.addEventListener('click', resetFullGame);
      ui.btnRestartAfterEnd.addEventListener('click', resetFullGame);

      ui.btnStart.addEventListener('click', startNewPlay);
      ui.btnNextPlay.addEventListener('click', startNewPlay);

      ui.btnSafe.addEventListener('click', () => handleInitialCall('SAFE'));
      ui.btnOut.addEventListener('click', () => handleInitialCall('OUT'));

      ui.btnEnterReplay.addEventListener('click', enterReplayReview);
      ui.btnCallStands.addEventListener('click', () => handleReplayDecision(false));
      ui.btnCallOverturned.addEventListener('click', () => handleReplayDecision(true));
      ui.btnInspectAfter.addEventListener('click', openFreeInspect);

      ui.btnReplayPlay.addEventListener('click', () => {
        if (!state.play) return;
        ensureAudio();
        if (state.t >= DURATION - 0.01) jumpReplayTime(0);
        state.playing = !state.playing;
        ui.btnReplayPlay.textContent = state.playing ? '⏸ 暫停' : '▶ 播放';
      });

      ui.btnStepBack.addEventListener('click', () => {
        if (!state.play) return;
        state.playing = false;
        ui.btnReplayPlay.textContent = '▶ 播放';
        jumpReplayTime(state.t - 0.01);
      });

      ui.btnStepFwd.addEventListener('click', () => {
        if (!state.play) return;
        state.playing = false;
        ui.btnReplayPlay.textContent = '▶ 播放';
        jumpReplayTime(state.t + 0.01);
      });

      ui.btnJumpImpact.addEventListener('click', () => {
        if (!state.play) return;
        const keyMoment = Math.min(state.play.baseTouchTime, state.play.ballCatchTime);
        jumpReplayTime(Math.max(0, keyMoment - 0.12));
        state.playing = false;
        ui.btnReplayPlay.textContent = '▶ 播放';
      });

      ui.btnZoom.addEventListener('click', () => {
        state.replayZoom = !state.replayZoom;
        ui.btnZoom.textContent = state.replayZoom ? '🔍 壘包特寫：開' : '🔍 壘包特寫：關';
      });

      ui.speedBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const sp = parseFloat(btn.dataset.speed);
          state.playbackRate = sp;
          setSpeedBtnActive(sp);
        });
      });

      ui.replayScrubber.addEventListener('input', (e) => {
        if (!state.play) return;
        state.playing = false;
        ui.btnReplayPlay.textContent = '▶ 播放';
        jumpReplayTime(parseInt(e.target.value, 10) / 1000);
      });

      window.addEventListener('keydown', (e) => {
        if (e.repeat && e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
        const key = e.key.toLowerCase();

        if (key === ' ') {
          e.preventDefault();
          if (state.phase === 'IDLE' || state.phase === 'RESULT') startNewPlay();
          else if (state.phase === 'CHALLENGE_BANNER') enterReplayReview();
          else if (state.phase === 'REPLAY_REVIEW' || state.freeInspectMode) ui.btnReplayPlay.click();
        } else if (key === 'a' && !ui.btnSafe.disabled && (state.phase === 'LIVE' || state.phase === 'AWAIT_JUDGE')) {
          handleInitialCall('SAFE');
        } else if (key === 'd' && !ui.btnOut.disabled && (state.phase === 'LIVE' || state.phase === 'AWAIT_JUDGE')) {
          handleInitialCall('OUT');
        } else if (e.key === 'ArrowLeft' && (state.phase === 'REPLAY_REVIEW' || state.freeInspectMode)) {
          e.preventDefault();
          ui.btnStepBack.click();
        } else if (e.key === 'ArrowRight' && (state.phase === 'REPLAY_REVIEW' || state.freeInspectMode)) {
          e.preventDefault();
          ui.btnStepFwd.click();
        }
      });

      updateScoreboardUI();
      updateStartButtonLabel();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
